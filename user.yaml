---
- name: Create a user shaddy
  hosts: all
  become: true
  tasks:
    - name: Ensure group "admin" exists
      ansible.builtin.group:
        name: admin
        state: present
      notify: Add the user shaddy with a specific uid and a primary group of 'admin'
  
  handlers:
    - name: Add the user shaddy with a specific uid and a primary group of 'admin'
      ansible.builtin.user:
        name: shaddy
        comment: shaddy
        uid: 1047
        group: admin
        state: present