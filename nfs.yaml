---
- name: NFS server
  hosts: prod
  become: true
  vars: 
    - directory: "/shared"
  
  tasks:
    - name: Install nfs-utils package
      ansible.builtin.dnf:
        name: nfs-utils
        state: present

    - name: Create directory for nfs
      ansible.builtin.file:
        path: "{{directory}}"
        state: directory
        mode: '0755'

    - name: Enable Nfs server
      ansible.builtin.service:
        name: nfs-server
        state: started
        enabled: yes

    - name: Configure /etc/exports
      ansible.builtin.copy:
        dest: /etc/exports
        content: "{{directory}} 192.168.1.120(rw,sync,no_subtree_check)"
      notify: Reload exports

  handlers:
    - name: Reload exports
      ansible.builtin.command: exportfs -ra